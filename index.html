<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YoutubeTogether</title><link rel="stylesheet" href="css/theme.css"></head><body>
<div class="auth"><div class="md" style="width:min(400px,100%)"><div class="logo" style="padding:0">Youtube<i>Together</i></div><div class="mu">Watch YouTube in sync with your friends.</div>
<h2 id="title" style="margin:6px 0 0">Log in</h2><input class="in" id="user" placeholder="Username (a-z, 0-9, _)" autocomplete="username"><input class="in" id="pass" type="password" placeholder="Password" autocomplete="current-password">
<button class="btn p" id="go">Log in</button><button class="btn" id="switch">Need an account? Register</button><div id="msg" class="err"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script><script type="module" src="js/index.js"></script></body></html>
