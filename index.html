<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YoutubeTogether</title><link rel="stylesheet" href="css/base.css"></head><body>
<div class="wrap" style="max-width:420px"><h1>▶ YoutubeTogether</h1><p class="mut">Watch YouTube in sync with your friends.</p>
<div class="card"><h2 id="title">Log in</h2>
<div class="row" style="flex-direction:column;align-items:stretch">
<input id="user" placeholder="Username (a-z, 0-9, _)" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password">
<button id="go">Log in</button><button id="switch" class="ghost">Need an account? Register</button><div id="msg" class="err"></div></div></div></div>
<script type="module" src="js/index.js"></script></body></html>
